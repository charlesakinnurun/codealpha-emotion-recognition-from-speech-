name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas soundfile scikit-learn matplotlib seaborn pyyaml
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest

  test-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime + dev deps + CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas soundfile scikit-learn matplotlib seaborn pyyaml
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Test (including torch CNN tests)
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas soundfile scikit-learn matplotlib seaborn pyyaml
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest
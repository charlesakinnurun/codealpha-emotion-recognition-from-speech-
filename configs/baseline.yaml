# Classical baseline experiment configuration.
#
# Paths are resolved relative to this file's directory.
seed: 42
kfold_splits: 5
model_kinds: [logreg, svm, rf]
metadata: ../data/processed/metadata.csv
output_dir: ../reports/experiments

# FeatureConfig fields (see src/emotion_recognition/features/extractor.py).
features:
  target_sr: 16000
  duration_s: 4.0
  n_fft: 1024
  hop_length: 256
  n_mels: 64
  fmax: 8000.0
  n_mfcc: 40
  delta_width: 9
  f0_min: 75.0
  f0_max: 400.0
  rolloff_percent: 0.85
  normalize_rms: false
  pool_stats: [mean, std]
  pool_groups: [mfcc, delta, delta2, spectral, prosodic]